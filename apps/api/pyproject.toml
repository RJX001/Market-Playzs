[project]
name = "marketplays-api"
version = "0.1.0"
description = "Marketplays FastAPI backend (Vercel Python runtime)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic[email]>=2.9.0",
  "pydantic-settings>=2.0",
  "sqlalchemy>=2.0",
  "psycopg2-binary>=2.9",
  "geoalchemy2>=0.14",
  "alembic>=1.13",
  "stripe>=11.0.0",
  "python-multipart>=0.0.12",
  "bcrypt>=4.0",
  "PyJWT>=2.8",
  "email-validator>=2.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
]

[tool.vercel]
# FastAPI ASGI instance must be named `app`.
# Entrypoint: app/main.py → import path app.main:app
entrypoint = "app/main.py"
# If Vercel cannot resolve nested packages, symlink/copy from apps/api root:
#   ln -s app/main.py ./main.py
